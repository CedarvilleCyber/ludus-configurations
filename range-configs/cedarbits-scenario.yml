# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json

ludus: 
  # traffic light machine
  - vm_name: "{{ range_id }}-traffic-server"
    hostname: "traffic-server"
    template: debian-12-x64-server-template
    vlan: 99
    ip_last_octet: 33
    ram_gb: 4
    cpus: 2
    linux: 
      packages: 
        - vim
        - curl
        - man
        - python3
    roles: 
      - web-setup
      - add-user
      - limit-ssh-connections
      - file-transfer
    role_vars:
      web_setup_type: nodejs 
      web_setup_url: "https://github.com/CedarvilleCyber/Jericho/raw/refs/heads/main/CedarbitsSite1.zip"
      addusr_user: "chappie"
      addusr_pass: "$y$j9T$j0NP79HnmII28sK.FJ1wZ/$9GQuxGzOn0oBLO4dLYMH6nRt7X.HZD9QHYyt76cop52"
      limit_ssh_conn_user: "chappie"
      file_transfer_src: /home/jericho-ludus/ludus-configs/cedarbits-payload.py
      file_transfer_dest: /home/chappie/.traffic-light-test-scripts/rapid-lights.py
      file_transfer_owning_user: "chappie"
      file_transfer_file_mode: "755"

  # put nuclear web server here

  # nuclear AD machine (for LDAP and maybe SMB)
  - vm_name: "{{ range_id }}-ad-dc-win2022-server-x64"
    hostname: "{{ range_id }}-DC01-2022"
    template: win2022-server-x64-template
    vlan: 99  # change later
    ip_last_octet: 228
    ram_gb: 8
    cpus: 4
    windows: 
      gpos: 
       - anon_share_access
  # you may need to use the "domain" key to make LDAP work

  # Kali for testing
  - vm_name: "{{range_id }}-test-kali"
    hostname: "kali"
    template: kali-x64-desktop-template
    vlan: 200
    ip_last_octet: 1
    ram_gb: 4
    cpus: 2
    linux: 
      packages: 
        - curl
        - nmap
        # check if you need to add man here

network:
  inter_vlan_default: REJECT
  external_default: ACCEPT   # Note: change this to ACCEPT, then deploy range,
                             # then change to REJECT and redeploy w/ -t networks flag
  rules: 
    - name: Inbound - allow students to send traffic to target server
      vlan_src: all
      vlan_dst: 99
      protocol: all
      ports: all
      action: ACCEPT
    - name: Outbound - allow return traffic from target to students
      vlan_src: 99
      vlan_dst: all
      protocol: all
      ports: all
      action: ACCEPT

