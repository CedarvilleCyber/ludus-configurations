  - vm_name: "{{ range_id }}-workstation-3"
    hostname: "workstation-3"
    template: win11-22h2-x64-enterprise-template
    vlan: 12
    ip_last_octet: 138
    ram_gb: 6
    cpus: 3
    windows: 
      office_version: 2021
      office_arch: 64bit

  - vm_name: "{{ range_id }}-jump-server"
    hostname: "jump-server"
    template: debian-12-x64-server-template
    vlan: 12
    ip_last_octet: 1
    ram_gb: 2
    cpus: 1
    linux: 
      packages: 
        - curl

  # subnet 3: OT
  # Note: you'll have to add this template to Ludus.
#  - vm_name: "{{ range_id }}-ot-hmi"
#    hostname: "ot-hmi"
#    template: ubuntu-24.04-x64-desktop-template
#    vlan: 13
