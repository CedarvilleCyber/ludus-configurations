network:  
  inter_vlan_default: REJECT
  rules:
    - name: Allow web traffic from the \"internet\" into the DMZ subnet
      vlan_src: 10 # vlan 10 represents the internet in our scenario
      vlan_dst: 11
      protocol: tcp
      ports: 80
      action: ACCEPT

      # Note: students need to compromise the workstations to get the HMI creds
    - name: Allow DMZ traffic to access the jump server
      vlan_src: 11
      vlan_dst: 12
      ip_last_octet_dst: 1
      protocol: all
      ports: all
      action: ACCEPT
    
    - name: Allow the jump server to access the HMI in the OT subnet
      vlan_src: 12
      ip_last_octet_src: 1
      vlan_dst: 13
      ip_last_octet_dst: 255
      protocol: tcp
      ports: 80
      action: ACCEPT
