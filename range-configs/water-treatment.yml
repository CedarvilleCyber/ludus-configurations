# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json

ludus: 
  # Subnet 0. This subnet is intended to simulate the external internet. 
  - vm_name: "{{ range_id }}-kali"
    hostname: "kali"
    template: kali-x64-desktop-template
    vlan: 10
    ip_last_octet: 1
    ram_gb: 4
    cpus: 2
    linux:
      packages:
        - curl
        - nmap
        - python3
        - tmux
        - vim

  # Subnet 1: DMZ
  - vm_name: "{{ range_id }}-web-server"
    hostname: "web-server"
    template: debian-12-x64-server-template
    vlan: 11
    ip_last_octet: 49
    ram_gb: 4
    cpus: 2
    linux:
      packages:
        - curl
        - tmux
        - vim
    roles: 
      - web-setup
      - add-user
    role_vars:
      web_setup_type: apache
      web_setup_url: "https://github.com/CedarvilleCyber/Jericho/raw/refs/heads/main/demo-website.zip"
      addusr_user: "erikwilliams"
      addusr_pass: "$y$j9T$zG5e2v4BmN0gnBkNFsrR8.$hJMiEhrVEGK/M/bIjFz0SKoKtWX98Fd9qVd9DhVrvd4"

