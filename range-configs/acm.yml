# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json

ludus: 
  - vm_name: "{{ range_id }}-test-kali"
    hostname: "kali"
    template: "kali-x64-desktop-template"
    vlan: 9
    ip_last_octet: 7
    ram_gb: 6
    cpus: 4
    linux: 
      packages: 
        - curl
        - dnsutils
        - tmux
        - vim
        - nmap
        - gobuster
        - seclists
        - snmp
        - proxychains4
        - hydra

  - vm_name: "{{ range_id }}-web-server"
    hostname: "jer-web01"
    template: "debian-12-x64-server-template"
    vlan: 10
    ip_last_octet: 139
    ram_gb: 4
    cpus: 2
    linux: 
      packages: 
        - man
        - curl
        - dnsutils
        - tmux
        - vim
        - ftp # this is an FTP client, not server
    roles: 
      - web-setup
      - add-user
      - privesc
    role_vars: 
      web_setup_type: "apache"
      web_setup_servername: "jerichotraffic.org"
      web_setup_app_url: "https://github.com/CedarvilleCyber/Jericho/raw/refs/heads/main/acm-site.tar.gz"
      web_setup_sql_url: "https://raw.githubusercontent.com/CedarvilleCyber/Jericho/refs/heads/main/acm/database_setup.sql"
      addusr_user: "ewilliams"
      addusr_pass: "elegant-crab"
      addusr_sudo: true
      addusr_gen_ssh_key: true
      ludus_privesc_binary: "base64"
      ludus_privesc_package: "coreutils"

#  - vm_name: "{{ range_id }}-windows-workstation"
