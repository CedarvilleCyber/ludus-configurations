  - vm_name: "{{ range_id }}-ot-server"
    hostname: "ot-server"
    template: "debian-12-x64-server-template"
    vlan: 11
    ip_last_octet: 43
    ram_gb: 4
    cpus: 2
    linux: 
      packages: 
        - man
        - curl
        - dnsutils
        - vim
        - tmux
        - python3
        - python3-rich
        - python3-requests
    roles: 
      - ludus_local_users
      - snmp
      - file_transfer
      - update_bash_config
    role_vars: 
      ludus_local_users: 
        - login: "mjackson"
          password: "dragon"
          sudo_nopasswd: true
      file_transfer_src: "https://raw.githubusercontent.com/CedarvilleCyber/Jericho/refs/heads/feature/nuclear-tui/control-panels/nuclear-effect/nuclear-tui.py"
      file_transfer_dst: "/home/mjackson/nuclear-control.py"
      update_bash_config_user: "mjackson"
      update_bash_config_file: ".bash_profile"
      update_bash_config_block: | 
            if [ -z "$NUCLEAR_CONTROL_OPERATIONAL" ]; then
                tmux new-session 2>/dev/null
                tmux rename-window -t 0 "Control" 2>/dev/null
                tmux send-keys -t "Control" "python3 /home/mjackson/nuclear-control.py" C-m
                export NUCLEAR_CONTROL_OPERATIONAL=1
            fi

network: 
  inter_vlan_default: REJECT
  rules: 
    # NOTE: you must have Ludus 2.0.10 or newer to use a comma-separated port list
  - name: allow public vlan to DMZ vlan on port 22, 80, and 443
    vlan_src: 9
    vlan_dst: 10
    protocol: tcp
    ports: 22, 80, 443
    action: ACCEPT
  - name: allow DMZ vlan to public vlan on port 22, 80, and 443
    vlan_src: 10
    vlan_dst: 9
    protocol: tcp
    ports: 22, 80, 443
    action: ACCEPT

  - name: allow DMZ vlan to ping IT vlan
    vlan_src: 10
    vlan_dst: 11
    protocol: icmp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from DMZ vlan to IT vlan
    vlan_src: 10
    vlan_dst: 11
    protocol: tcp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from IT vlan to DMZ vlan
    vlan_src: 11
    vlan_dst: 10
    protocol: tcp
    ports: all
    action: ACCEPT

  - name: allow all UDP traffic from DMZ vlan to IT vlan
    vlan_src: 10
    vlan_dst: 11
    protocol: udp
    ports: all
    action: ACCEPT
  - name: allow all UDP traffic from IT vlan to DMZ vlan
    vlan_src: 11
    vlan_dst: 10
    protocol: udp
    ports: all
    action: ACCEPT

  - name: allow IT vlan to ping OT vlan
    vlan_src: 11
    vlan_dst: 12
    protocol: icmp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from IT vlan to OT vlan
    vlan_src: 11
    vlan_dst: 12
    protocol: tcp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from OT vlan to IT vlan
    vlan_src: 12
    vlan_dst: 11
    protocol: tcp
    ports: all
    action: ACCEPT

  - name: allow all UDP traffic from IT vlan to OT vlan
    vlan_src: 11
    vlan_dst: 12
    protocol: udp
    ports: all
    action: ACCEPT
  - name: allow all UDP traffic from OT vlan to IT vlan
    vlan_src: 12
    vlan_dst: 11
    protocol: udp
    ports: all
    action: ACCEPT

