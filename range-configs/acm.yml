  - vm_name: "{{ range_id }}-ot-server"
    hostname: "ot-server"
    template: "debian-12-x64-server-template"
    vlan: 11 # NOTE: change back to 12 if you get the windows workstation working
    ip_last_octet: 43
    ram_gb: 4
    cpus: 2
    linux: 
      packages: 
        - man
        - curl
        - dnsutils
        - tmux
        - vim
    roles: 
      - add-user
      - bertvv.vsftpd
      - file-transfer
      - snmp
    role_vars: 
      addusr_user: "mjackson"
      addusr_pass: "nervous-salmon" # follows an adjective-noun password policy
      addusr_sudo: true
      vsftpd_anon_root: /srv/shares/public
      file_transfer_src: "https://raw.githubusercontent.com/CedarvilleCyber/Jericho/refs/heads/main/acm/ot-pwd-policy.md"
      file_transfer_dst: "/srv/shares/public/password-policy.md"

network: 
  inter_vlan_default: REJECT
  rules: 
    # NOTE: you must have Ludus 2.0.10 or newer to use a comma-separated port list
  - name: allow public vlan to DMZ vlan on port 22, 80, and 443
    vlan_src: 9
    vlan_dst: 10
    protocol: tcp
    ports: 22, 80, 443
    action: ACCEPT
  - name: allow DMZ vlan to public vlan on port 22, 80, and 443
    vlan_src: 10
    vlan_dst: 9
    protocol: tcp
    ports: 22, 80, 443
    action: ACCEPT

  - name: allow DMZ vlan to ping IT vlan
    vlan_src: 10
    vlan_dst: 11
    protocol: icmp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from DMZ vlan to IT vlan
    vlan_src: 10
    vlan_dst: 11
    protocol: tcp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from IT vlan to DMZ vlan
    vlan_src: 11
    vlan_dst: 10
    protocol: tcp
    ports: all
    action: ACCEPT

  - name: allow IT vlan to ping OT vlan
    vlan_src: 11
    vlan_dst: 12
    protocol: icmp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from IT vlan to OT vlan
    vlan_src: 11
    vlan_dst: 12
    protocol: tcp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from OT vlan to IT vlan
    vlan_src: 12
    vlan_dst: 11
    protocol: tcp
    ports: all
    action: ACCEPT
