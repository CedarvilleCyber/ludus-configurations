network: 
  inter_vlan_default: REJECT
  rules: 
  - name: allow public vlan to ping DMZ vlan
    vlan_src: 9
    vlan_dst: 10
    protocol: icmp
    ports: all
    action: ACCEPT

    # NOTE: you must have Ludus 2.0.10 or newer to use a comma-separated port list
  - name: allow public vlan to DMZ vlan on port 22, 80, and 443
    vlan_src: 9
    vlan_dst: 10
    protocol: tcp
    ports: 22, 80, 443
    action: ACCEPT

  - name: allow DMZ vlan to ping IT vlan
    vlan_src: 10
    vlan_dst: 11
    protocol: icmp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from DMZ vlan to IT vlan
    vlan_src: 10
    vlan_dst: 11
    protocol: tcp
    ports: all
    action: ACCEPT

  - name: allow IT vlan to ping OT vlan
    vlan_src: 11
    vlan_dst: 12
    protocol: icmp
    ports: all
    action: ACCEPT
  - name: allow all TCP traffic from IT vlan to OT vlan
    vlan_src: 11
    vlan_dst: 12
    protocol: tcp
    ports: all
    action: ACCEPT
