---

- name: ensure unzip and CA certificates are installed
  ansible.builtin.package:
    name: 
      - ca-certificates
      - unzip
    state: present
  become: true

- name: validate web_setup_type
  assert: 
    that: 
      - web_setup_type is defined
      - web_setup_type in ['apache', 'nodejs']
    fail_msg: "web_setup_type must be either 'apache' or 'nodejs', got '{{ web_setup_type }}'"
    success_msg: "web_setup_type is set to '{{ web_setup_type }}'"

- name: Set up the web app using Apache
  when: web_setup_type == 'apache'
  block: 
    - name: install Apache
      ansible.builtin.include_role: 
        name: geerlingguy.apache
  
    - name: unzip the web app into /var/www/html
      ansible.builtin.unarchive: 
        src: "{{ web_setup_url }}"
        dest: /var/www/html
        remote_src: yes

- name: set up the web app using Node JS
  when: web_setup_type == 'nodejs'
  block:
    - name: install Node JS
      ansible.builtin.include_role:
        name: geerlingguy.nodejs

    - name: create nodejs user
      ansible.builtin.user: 
        name: nodejs
        system: yes
        shell: /bin/false
        home: /opt/nodejs

    - name: unzip the web app into the user's home directory
      ansible.builtin.unarchive:
        src: "{{ web_setup_url }}"
        dest: /opt/nodejs
        remote_src: yes

    # add a command to start the thing here. Something like "node server.js" ?
