---
- name: Verify that ludus_privesc_binary is defined w/ package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install binary if not found
  ansible.builtin.package:
    name: "{{ ludus_privesc_binary }}"
    state: present
  when: ludus_privesc_binary not in ansible_facts.packages

- name: Retrieve full binary path
  ansible.builtin.find:
    paths:
      - /usr/bin
      - /usr/sbin
      - /
    file_type: file
    use_regex: true
    patterns: "^{{ ludus_privesc_binary }}$"
    recurse: true
    limit: 1
  register: ludus_privesc_binary_find

- name: Fail if binary not found
  ansible.builtin.fail:
    msg: "Binary {{ ludus_privesc_binary }} could not be found in PATH"
  when: ludus_privesc_binary_find.files | length == 0

- name: Set binary path fact
  ansible.builtin.set_fact:
    ludus_privesc_binary_path: "{{ ludus_privesc_binary_find.files[0].path }}"

- name: Set SUID bit on binary
  ansible.builtin.file:
    path: "{{ ludus_privesc_binary_path }}"
    mode: '4755'
  register: ludus_privesc_suid_result

- name: Verify SUID bit is set
  ansible.builtin.stat:
    path: "{{ ludus_privesc_binary_path }}"
  register: ludus_privesc_binary_stat

- name: Display SUID status
  ansible.builtin.debug:
    msg: |
      Binary: {{ ludus_privesc_binary }}
      Path: {{ ludus_privesc_binary_path }}
      SUID bit set: {{ ludus_privesc_binary_stat.stat.suid }}
      Mode: {{ ludus_privesc_binary_stat.stat.mode }}
