---
- name: Install HMI website service
  become: true
  ansible.builtin.template:
    src: python-website.service.j2
    dest: /etc/systemd/system/python-website.service
    owner: root
    group: root
    mode: "0644"
  register: website_service

- name: Enable and start HMI website
  become: true
  ansible.builtin.systemd_service:
    name: python-website
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if website_service.changed else 'started' }}"
    
