network:
  inter_vlan_default: REJECT
  external_default: REJECT   # Note: change this to ACCEPT, then deploy range,
                             # then change back and redeploy w/ -t networks flag
  rules: 
    - name: Inbound - allow students to send traffic to target server
      vlan_src: all
      vlan_dst: 99
      protocol: all
      ports: all
      action: ACCEPT
    - name: Outbound - allow return traffic from target to students
      vlan_src: 99
      vlan_dst: all
      protocol: all
      ports: all
      action: ACCEPT

